services:
  server:
    # Compatibility fallback for hosts without network_mode: host. The bounded
    # TURN relay range is published 1:1 to avoid address translation mismatch.
    network_mode: !reset null
    environment:
      RUGRAM_LISTEN: 0.0.0.0:${RUGRAM_SERVER_PORT:-2398}
      RUGRAM_PUBLIC_LINK_WEB_ADDR: 0.0.0.0:${RUGRAM_PUBLIC_LINK_PORT:-2401}
      RUGRAM_POSTGRES_DSN: postgres://${POSTGRES_USER:-rugram}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rugram_main}?sslmode=disable
      RUGRAM_REDIS_ADDR: redis:6379
      RUGRAM_ADMIN_API_ADDR: 0.0.0.0:${RUGRAM_ADMIN_API_PORT:-2599}
      RUGRAM_TURN_RELAY_MAX_PORT: ${RUGRAM_TURN_BRIDGE_RELAY_MAX_PORT:-12563}
      RUGRAM_SERVER_HEALTH_IP: 127.0.0.1
      RUGRAM_SERVER_HEALTH_URL_HOST: 127.0.0.1
    ports:
      - name: mtproto
        target: ${RUGRAM_SERVER_PORT:-2398}
        published: "${RUGRAM_SERVER_PORT:-2398}"
        host_ip: ${RUGRAM_PUBLIC_BIND_IP:-127.0.0.1}
        protocol: tcp
      - name: public-links
        target: ${RUGRAM_PUBLIC_LINK_PORT:-2401}
        published: "${RUGRAM_PUBLIC_LINK_PORT:-2401}"
        host_ip: ${RUGRAM_LOCAL_BIND_IP:-127.0.0.1}
        protocol: tcp
      - name: rtmp-ingest
        target: ${RUGRAM_LIVESTREAM_RTMP_PORT:-2400}
        published: "${RUGRAM_LIVESTREAM_RTMP_PORT:-2400}"
        host_ip: ${RUGRAM_PUBLIC_BIND_IP:-127.0.0.1}
        protocol: tcp
      - name: sfu-media
        target: ${RUGRAM_SFU_UDP_PORT:-12399}
        published: "${RUGRAM_SFU_UDP_PORT:-12399}"
        host_ip: ${RUGRAM_PUBLIC_BIND_IP:-127.0.0.1}
        protocol: udp
      - name: turn
        target: ${RUGRAM_TURN_UDP_PORT:-12400}
        published: "${RUGRAM_TURN_UDP_PORT:-12400}"
        host_ip: ${RUGRAM_PUBLIC_BIND_IP:-127.0.0.1}
        protocol: udp
      - "${RUGRAM_PUBLIC_BIND_IP:-127.0.0.1}:${RUGRAM_TURN_RELAY_MIN_PORT:-12500}-${RUGRAM_TURN_BRIDGE_RELAY_MAX_PORT:-12563}:${RUGRAM_TURN_RELAY_MIN_PORT:-12500}-${RUGRAM_TURN_BRIDGE_RELAY_MAX_PORT:-12563}/udp"
    networks:
      - data
      - control
      - outbound

  admin:
    network_mode: !reset null
    environment:
      RUGRAM_POSTGRES_DSN: postgres://${POSTGRES_USER:-rugram}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rugram_main}?sslmode=disable
      RUGRAM_ADMIN_API_ADDR: server:${RUGRAM_ADMIN_API_PORT:-2599}
      RUGRAM_ADMIN_UI_ADDR: 0.0.0.0:${RUGRAM_ADMIN_PORT:-2600}
      RUGRAM_ADMIN_HEALTH_IP: 127.0.0.1
    ports:
      - name: admin-ui
        target: ${RUGRAM_ADMIN_PORT:-2600}
        published: "${RUGRAM_ADMIN_PORT:-2600}"
        host_ip: ${RUGRAM_ADMIN_BIND_IP:-127.0.0.1}
        protocol: tcp
    networks:
      - data
      - control
      - admin_host_access
